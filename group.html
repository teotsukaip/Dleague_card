<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>D.LEAGUE AR — CyberAgent legit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./css/app.css" />
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      /* 遷移直後のチラつき防止。group.html は同じ緑黒で始まる */
      html, body { background: #07110d; }
      .mock-plate {
        position: fixed;
        left: 50%;
        top: 38%;
        transform: translate(-50%, -50%);
        z-index: 46;
        width: min(86vw, 420px);
        filter: drop-shadow(0 18px 40px rgba(0,0,0,.45));
      }
    </style>
  </head>
  <body>
    <div id="ar-root"></div>
    <div id="freeze"></div>
    <canvas id="dust"></canvas>

    <div id="overlay" data-state="start">
      <div class="portal-ring" aria-hidden="true"></div>
      <div class="panel">
        <div class="brand" id="badge-name">CyberAgent legit</div>
        <img class="logo-mark" src="./assets/logo-ui.png" alt="" />
        <h1 class="title" id="overlay-title">人物をスキャン</h1>
        <p class="sub" id="overlay-sub">カードの人物をかざすと「TAKUMIです」がAR表示されます。</p>
        <div class="scan-frame" aria-hidden="true">
          <i></i><i></i><i></i><i></i>
          <div class="scan-line"></div>
        </div>
        <div class="progress"><span id="progress-bar"></span></div>
        <div class="actions">
          <button class="btn" id="start-btn" type="button">スキャンを開始</button>
          <button class="btn ghost" id="retry-btn" type="button">再試行</button>
        </div>
      </div>
    </div>

    <div class="hint-chip" id="hint-chip">TAKUMIです</div>
    <img class="mock-plate" id="mock-plate" src="./assets/nameplate.png" alt="TAKUMIです" hidden />

    <script type="module" src="./js/group.js"></script>
  </body>
</html>
