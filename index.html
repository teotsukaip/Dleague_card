<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>D.LEAGUE AR — ロゴスキャン</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./css/app.css" />
    <link rel="prefetch" href="./group.html?g=legit" />
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  </head>
  <body>
    <div id="ar-root"></div>
    <div id="freeze"></div>
    <canvas id="dust"></canvas>

    <div id="overlay" data-state="start">
      <div class="portal-ring" aria-hidden="true"></div>
      <div class="panel">
        <div class="brand">D.LEAGUE CARD AR</div>
        <img class="logo-mark" src="./assets/logo-ui.png" alt="CyberAgent legit" />
        <h1 class="title" id="overlay-title">ロゴからグループへ</h1>
        <p class="sub" id="overlay-sub">まず CyberAgent legit のロゴをスキャンします。認識後、演出とともに人物スキャンへ移動します。</p>
        <div class="scan-frame" aria-hidden="true">
          <i></i><i></i><i></i><i></i>
          <div class="scan-line"></div>
          <img src="./assets/markers/logo.png" alt="" />
        </div>
        <div class="progress"><span id="progress-bar"></span></div>
        <div class="actions">
          <button class="btn" id="start-btn" type="button">カメラを起動</button>
          <button class="btn ghost" id="mock-btn" type="button">カメラなしで演出確認</button>
        </div>
      </div>
    </div>

    <script type="module" src="./js/gate.js"></script>
  </body>
</html>
